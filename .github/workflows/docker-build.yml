# =============================================================================
# .github/workflows/docker-build.yml
#
# Polls the upstream GitHub repository for new konnect releases every night at
# midnight UTC. When a version newer than the latest image already published to
# GHCR is found, the workflow builds and pushes both image variants for
# linux/amd64 and linux/arm64 to Docker Hub and GitHub Container Registry.
#
# konnect is NOT on PyPI — releases are tracked via the GitHub Releases API:
#   https://api.github.com/repos/metallkopf/konnect/releases/latest
#
# Image variants and tags (consistent across both registries):
#
#   Minimal image
#     ferdiu/konnect:latest
#     ferdiu/konnect:X.Y.Z
#     ghcr.io/ferdiu/konnect:latest
#     ghcr.io/ferdiu/konnect:X.Y.Z
#
#   Full image (konnect + common Linux utilities)
#     ferdiu/konnect:latest-full
#     ferdiu/konnect:X.Y.Z-full
#     ghcr.io/ferdiu/konnect:latest-full
#     ghcr.io/ferdiu/konnect:X.Y.Z-full
#
# Required repository secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (read/write, not your password)
#
# The GITHUB_TOKEN secret is provided automatically by Actions.
# =============================================================================

name: Build & Publish Docker images

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch: # allow manual trigger from the Actions tab
    inputs:
      force_build:
        description: "Force build even if no new version is detected"
        required: false
        default: "false"

env:
  # Upstream repository to poll for releases
  UPSTREAM_REPO: metallkopf/konnect

  # Single Docker Hub repository — variants are distinguished by tag suffix
  DOCKERHUB_REPO: ferdiu/konnect

  # GitHub Container Registry image (same repo, same tag scheme)
  GHCR_IMAGE: ghcr.io/ferdiu/konnect

##############################################################################
# Job 1 — Poll upstream and GHCR, decide whether a build is needed
##############################################################################
jobs:
  check-version:
    name: Check upstream version
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      new_version: ${{ steps.compare.outputs.new_version }}
      should_build: ${{ steps.compare.outputs.should_build }}

    steps:
      - name: Resolve latest upstream release from GitHub
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Use the GitHub REST API to find the latest release tag.
          # The GITHUB_TOKEN is used to avoid unauthenticated rate-limit (60 req/h).
          # Strip a leading "v" so we get a bare semver, e.g. "0.4.0".
          VERSION=$(gh api "repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
            --jq '.tag_name | ltrimstr("v")')

          [ -n "$VERSION" ] || { echo "ERROR: could not resolve upstream version"; exit 1; }

          echo "upstream_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $VERSION"

      - name: Resolve latest published version from GHCR
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Query the GHCR package versions API and extract the highest
          # bare semver tag (x.y.z) already published.  This is the source
          # of truth for what has already been built — no git tags needed.
          VERSION=$(gh api "users/ferdiu/packages/container/konnect/versions" \
            --jq '[.[].metadata.container.tags[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort | last' \
            2>/dev/null || echo "")

          echo "local_version=${VERSION:-none}" >> "$GITHUB_OUTPUT"
          echo "Latest published version: ${VERSION:-<none>}"

      - name: Compare versions and decide
        id: compare
        run: |
          set -euo pipefail
          UPSTREAM="${{ steps.upstream.outputs.upstream_version }}"
          LOCAL="${{ steps.local.outputs.local_version }}"
          FORCE="${{ github.event.inputs.force_build }}"

          # Normalise to zero-padded integers for numeric comparison (x.y.z)
          norm() { echo "$1" | awk -F. '{printf "%05d%05d%05d\n", $1+0, $2+0, $3+0}'; }

          echo "new_version=$UPSTREAM" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "→ Forced build requested"
          elif [ "$LOCAL" = "none" ] || [ "$(norm "$UPSTREAM")" -gt "$(norm "$LOCAL")" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "→ New version detected ($LOCAL → $UPSTREAM), build needed"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "→ Already up to date ($LOCAL), skipping"
          fi

  ##############################################################################
  # Job 2 — Build and push images
  ##############################################################################
  build-and-push:
    name: Build & push (${{ matrix.variant.tag }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    # "packages: write" is required for GITHUB_TOKEN to push to GHCR.
    # Without this explicit grant the token only has read access and every
    # push attempt returns "denied: installation not allowed to Create
    # organization package".
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        variant:
          # ---- minimal image -----------------------------------------------
          - tag: konnect
            target: konnect
            suffix: "" # tags: "latest",      "X.Y.Z"

          # ---- full image --------------------------------------------------
          - tag: konnect-full
            target: konnect-full
            suffix: "-full" # tags: "latest-full",  "X.Y.Z-full"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # QEMU is required to emulate arm64 on the amd64 GitHub-hosted runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---- Registry logins -------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Compute image metadata (tags + labels) --------------------------
      - name: Compute Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            # Immutable version tag, e.g. "0.4.0" or "0.4.0-full"
            type=raw,value=${{ needs.check-version.outputs.new_version }}${{ matrix.variant.suffix }}
            # Rolling "latest" tag (or "latest-full")
            type=raw,value=latest${{ matrix.variant.suffix }}
          labels: |
            org.opencontainers.image.title=${{ matrix.variant.tag }}
            org.opencontainers.image.description=Headless KDE Connect server (${{ matrix.variant.tag }} variant)
            org.opencontainers.image.version=${{ needs.check-version.outputs.new_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0

      # ---- Build & push ----------------------------------------------------
      - name: Build and push ${{ matrix.variant.tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Build only the target stage so the final image is not polluted
          target: ${{ matrix.variant.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KONNECT_VERSION=${{ needs.check-version.outputs.new_version }}
            IMAGE_TITLE=${{ matrix.variant.tag }}
            IMAGE_DESCRIPTION=Headless KDE Connect server (${{ matrix.variant.tag }} variant)
          # Reuse layer cache stored in GHCR to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache${{ matrix.variant.suffix }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache${{ matrix.variant.suffix }},mode=max

      # ---- Sync README to Docker Hub description ---------------------------
      # Runs only for the minimal variant (suffix == "") to avoid pushing the
      # same README twice — both variants share a single Docker Hub repo.
      # peter-evans/dockerhub-description@v5 requires a Docker Hub personal
      # access token (read/write scope) stored as DOCKERHUB_TOKEN.
      - name: Update Docker Hub description
        if: matrix.variant.suffix == ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          readme-filepath: ./README.md
          short-description: ${{ github.event.repository.description }}
